name: Build

on:
  push:
    branches: [main, nekoland]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gettext and GJS
        run: sudo apt-get update && sudo apt-get install --yes gettext gjs gir1.2-soup-3.0

      - name: Run the tests
        run: gjs -m tests/run.js

      - name: Check scripts and settings schema
        run: |
          bash -n install.sh uninstall.sh setup-scene-renderer.sh
          glib-compile-schemas --strict --dry-run src/schemas
          for catalogue in po/*.po; do msgfmt --check -o /dev/null "$catalogue"; done
